<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionario Socioeconomico</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Questionario Socioeconomico</h1>
            <p>Pesquisa sobre perfil pessoal, educacional e profissional</p>
        </header>

        <div id="secao-formulario">
            <form id="formQuestionario">
                <section class="categoria">
                    <h2>Dados Pessoais</h2>

                    <div class="pergunta">
                        <label>1. Qual e a sua faixa etaria?</label>
                        <select name="perguntaPessoal1" required>
                            <option value="">Selecione...</option>
                            <option>Menos de 18 anos</option>
                            <option>18 a 25 anos</option>
                            <option>26 a 35 anos</option>
                            <option>36 a 50 anos</option>
                            <option>Mais de 50 anos</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>2. Qual e o seu genero?</label>
                        <select name="perguntaPessoal2" required>
                            <option value="">Selecione...</option>
                            <option>Feminino</option>
                            <option>Masculino</option>
                            <option>Nao-binario</option>
                            <option>Prefiro nao informar</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>3. Qual e o seu estado civil?</label>
                        <select name="perguntaPessoal3" required>
                            <option value="">Selecione...</option>
                            <option>Solteiro(a)</option>
                            <option>Casado(a) / Uniao estavel</option>
                            <option>Divorciado(a)</option>
                            <option>Viuv(a)</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>4. Quantas pessoas residem em sua casa?</label>
                        <select name="perguntaPessoal4" required>
                            <option value="">Selecione...</option>
                            <option>1 pessoa</option>
                            <option>2 pessoas</option>
                            <option>3 a 4 pessoas</option>
                            <option>5 ou mais pessoas</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>5. Qual e a sua renda familiar mensal?</label>
                        <select name="perguntaPessoal5" required>
                            <option value="">Selecione...</option>
                            <option>Ate 1 salario minimo</option>
                            <option>De 1 a 3 salarios minimos</option>
                            <option>De 3 a 5 salarios minimos</option>
                            <option>De 5 a 10 salarios minimos</option>
                            <option>Acima de 10 salarios minimos</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>6. Voce e responsavel financeiro principal da familia?</label>
                        <select name="perguntaPessoal6" required>
                            <option value="">Selecione...</option>
                            <option>Sim</option>
                            <option>Nao</option>
                            <option>Divido com outra pessoa</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>7. Qual e a sua regiao de moradia?</label>
                        <select name="perguntaPessoal7" required>
                            <option value="">Selecione...</option>
                            <option>Centro</option>
                            <option>Zona Norte</option>
                            <option>Zona Sul</option>
                            <option>Zona Leste</option>
                            <option>Zona Oeste</option>
                            <option>Periferia</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>8. Voce possui plano de saude?</label>
                        <select name="perguntaPessoal8" required>
                            <option value="">Selecione...</option>
                            <option>Sim, particular</option>
                            <option>Sim, por convenio empresarial</option>
                            <option>Sim, publico (SUS)</option>
                            <option>Nao possuo</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>9. Voce possui acesso a internet em casa?</label>
                        <select name="perguntaPessoal9" required>
                            <option value="">Selecione...</option>
                            <option>Sim, banda larga fixa</option>
                            <option>Sim, apenas movel (celular)</option>
                            <option>Nao possuo</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>10. Voce se considera parte de qual classe social?</label>
                        <select name="perguntaPessoal10" required>
                            <option value="">Selecione...</option>
                            <option>Classe A</option>
                            <option>Classe B</option>
                            <option>Classe C</option>
                            <option>Classe D</option>
                            <option>Classe E</option>
                        </select>
                    </div>
                </section>

                <section class="categoria">
                    <h2>Dados Educacionais</h2>

                    <div class="pergunta">
                        <label>1. Qual e o seu nivel de escolaridade atual?</label>
                        <select name="perguntaEducacional1" required>
                            <option value="">Selecione...</option>
                            <option>Ensino Fundamental incompleto</option>
                            <option>Ensino Fundamental completo</option>
                            <option>Ensino Medio incompleto</option>
                            <option>Ensino Medio completo</option>
                            <option>Superior incompleto</option>
                            <option>Superior completo</option>
                            <option>Pos-graduacao / Mestrado / Doutorado</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>2. Voce estudou em escola publica ou privada?</label>
                        <select name="perguntaEducacional2" required>
                            <option value="">Selecione...</option>
                            <option>Apenas publica</option>
                            <option>Apenas privada</option>
                            <option>Ambas</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>3. Qual foi a ultima instituicao de ensino que voce frequentou?</label>
                        <select name="perguntaEducacional3" required>
                            <option value="">Selecione...</option>
                            <option>Escola municipal/estadual</option>
                            <option>Escola particular</option>
                            <option>Universidade publica</option>
                            <option>Universidade privada</option>
                            <option>Instituto federal / tecnico</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>4. Voce concluiu o ensino superior?</label>
                        <select name="perguntaEducacional4" required>
                            <option value="">Selecione...</option>
                            <option>Sim</option>
                            <option>Nao, mas estou cursando</option>
                            <option>Nao, e nao pretendo</option>
                            <option>Nao, mas pretendo</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>5. Voce ja realizou algum curso tecnico ou profissionalizante?</label>
                        <select name="perguntaEducacional5" required>
                            <option value="">Selecione...</option>
                            <option>Sim, concluido</option>
                            <option>Sim, em andamento</option>
                            <option>Nao, mas tenho interesse</option>
                            <option>Nao, e nao tenho interesse</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>6. Quantos idiomas voce domina (alem do portugues)?</label>
                        <select name="perguntaEducacional6" required>
                            <option value="">Selecione...</option>
                            <option>Nenhum</option>
                            <option>Um</option>
                            <option>Dois</option>
                            <option>Tres ou mais</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>7. Voce possui alguma certificacao profissional reconhecida?</label>
                        <select name="perguntaEducacional7" required>
                            <option value="">Selecione...</option>
                            <option>Sim, varias</option>
                            <option>Sim, uma ou duas</option>
                            <option>Nao, mas estou buscando</option>
                            <option>Nao</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>8. Como voce avalia a qualidade da educacao que recebeu?</label>
                        <select name="perguntaEducacional8" required>
                            <option value="">Selecione...</option>
                            <option>Excelente</option>
                            <option>Boa</option>
                            <option>Regular</option>
                            <option>Ruim</option>
                            <option>Pessima</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>9. Voce pretende continuar os estudos nos proximos dois anos?</label>
                        <select name="perguntaEducacional9" required>
                            <option value="">Selecione...</option>
                            <option>Sim, em graduacao</option>
                            <option>Sim, em pos-graduacao</option>
                            <option>Sim, em cursos livres</option>
                            <option>Nao pretendo</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>10. Qual foi o principal fator que influenciou sua trajetoria educacional?</label>
                        <select name="perguntaEducacional10" required>
                            <option value="">Selecione...</option>
                            <option>Apoio familiar</option>
                            <option>Oportunidades financeiras</option>
                            <option>Interesse pessoal</option>
                            <option>Necessidade profissional</option>
                            <option>Dificuldades financeiras</option>
                        </select>
                    </div>
                </section>

                <section class="categoria">
                    <h2>Dados Profissionais</h2>

                    <div class="pergunta">
                        <label>1. Qual e a sua situacao atual no mercado de trabalho?</label>
                        <select name="perguntaProfissional1" required>
                            <option value="">Selecione...</option>
                            <option>Empregado(a) com carteira assinada</option>
                            <option>Empregado(a) sem carteira</option>
                            <option>Autonomo(a)</option>
                            <option>Empresario(a)</option>
                            <option>Desempregado(a)</option>
                            <option>Aposentado(a)</option>
                            <option>Estudante</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>2. Ha quanto tempo voce esta na sua ocupacao atual?</label>
                        <select name="perguntaProfissional2" required>
                            <option value="">Selecione...</option>
                            <option>Menos de 1 ano</option>
                            <option>De 1 a 3 anos</option>
                            <option>De 3 a 5 anos</option>
                            <option>Mais de 5 anos</option>
                            <option>Nao estou trabalhando</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>3. Qual e o seu ramo de atuacao?</label>
                        <select name="perguntaProfissional3" required>
                            <option value="">Selecione...</option>
                            <option>Tecnologia</option>
                            <option>Saude</option>
                            <option>Educacao</option>
                            <option>Comercio</option>
                            <option>Industria</option>
                            <option>Servicos</option>
                            <option>Outro</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>4. Qual e o seu nivel hierarquico atual?</label>
                        <select name="perguntaProfissional4" required>
                            <option value="">Selecione...</option>
                            <option>Estagiario / Aprendiz</option>
                            <option>Operacional / Auxiliar</option>
                            <option>Tecnico / Analista</option>
                            <option>Coordenacao / Supervisao</option>
                            <option>Gerencia</option>
                            <option>Diretoria</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>5. Voce trabalha na sua area de formacao?</label>
                        <select name="perguntaProfissional5" required>
                            <option value="">Selecione...</option>
                            <option>Sim, totalmente</option>
                            <option>Parcialmente</option>
                            <option>Nao</option>
                            <option>Nao sou formado</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>6. Qual e a sua faixa salarial mensal?</label>
                        <select name="perguntaProfissional6" required>
                            <option value="">Selecione...</option>
                            <option>Ate 1 salario minimo</option>
                            <option>De 1 a 3 salarios minimos</option>
                            <option>De 3 a 5 salarios minimos</option>
                            <option>De 5 a 10 salarios minimos</option>
                            <option>Acima de 10 salarios minimos</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>7. Voce possui outro emprego ou fonte de renda?</label>
                        <select name="perguntaProfissional7" required>
                            <option value="">Selecione...</option>
                            <option>Sim</option>
                            <option>Nao</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>8. Como voce avalia a estabilidade do seu emprego atual?</label>
                        <select name="perguntaProfissional8" required>
                            <option value="">Selecione...</option>
                            <option>Muito estavel</option>
                            <option>Estavel</option>
                            <option>Incerto</option>
                            <option>Instavel</option>
                            <option>Nao se aplica</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>9. Voce pretende mudar de emprego nos proximos 12 meses?</label>
                        <select name="perguntaProfissional9" required>
                            <option value="">Selecione...</option>
                            <option>Sim, com certeza</option>
                            <option>Talvez</option>
                            <option>Nao</option>
                            <option>Nao se aplica</option>
                        </select>
                    </div>

                    <div class="pergunta">
                        <label>10. Qual fator mais influencia sua satisfacao profissional?</label>
                        <select name="perguntaProfissional10" required>
                            <option value="">Selecione...</option>
                            <option>Salario</option>
                            <option>Ambiente de trabalho</option>
                            <option>Oportunidades de crescimento</option>
                            <option>Reconhecimento</option>
                            <option>Equilibrio vida pessoal/trabalho</option>
                        </select>
                    </div>
                </section>

                <button type="submit" class="btn-enviar">Enviar Respostas</button>
            </form>
        </div>

        <div id="secao-graficos" style="display:none;">
            <div class="acao">
                <button onclick="voltarFormulario()" class="btn-secundario">Responder Novamente</button>
                <button onclick="carregarEstatisticas()" class="btn-secundario">Atualizar Graficos</button>
            </div>

            <section class="categoria-graficos">
                <h2>Resultados - Dados Pessoais</h2>
                <div id="graficos-pessoal" class="grid-graficos"></div>
            </section>

            <section class="categoria-graficos">
                <h2>Resultados - Dados Educacionais</h2>
                <div id="graficos-educacional" class="grid-graficos"></div>
            </section>

            <section class="categoria-graficos">
                <h2>Resultados - Dados Profissionais</h2>
                <div id="graficos-profissional" class="grid-graficos"></div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
