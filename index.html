<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionario Socioeconomico Pro</title>
    <!-- Biblioteca Chart.js para os graficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* RESET E BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --primary-dark: #0d47a1;
            --primary-main: #1976d2;
            --primary-light: #e3f2fd;
            --accent-blue: #42a5f5;
            --text-dark: #263238;
            --text-gray: #546e7a;
            --white: #ffffff;
            --shadow-sm: 0 2px 4px rgba(13, 71, 161, 0.1);
            --shadow-md: 0 4px 12px rgba(13, 71, 161, 0.15);
            --shadow-lg: 0 10px 25px rgba(13, 71, 161, 0.2);
            --radius: 12px;
        }

        body {
            background-color: #f0f4f8;
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        /* CONTAINER PRINCIPAL */
        .app-container {
            width: 100%;
            max-width: 1200px;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
        }

        /* HEADER */
        header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-main) 100%);
            color: var(--white);
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #42a5f5, #1976d2, #0d47a1);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* NAVEGACAO / TABS */
        .nav-tabs {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 20px;
        }

        .tab-btn {
            padding: 15px 25px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-gray);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-size: 1rem;
        }

        .tab-btn:hover {
            color: var(--primary-main);
            background: var(--primary-light);
        }

        .tab-btn.active {
            color: var(--primary-main);
            border-bottom-color: var(--primary-main);
            background: var(--white);
        }

        /* CONTEUDO DAS ABAS */
        .content-section {
            display: none;
            padding: 30px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CATEGORIAS DO FORMULARIO */
        .category-block {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 1.4rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-icon {
            width: 30px;
            height: 30px;
            background: var(--primary-main);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* LINHA DA PERGUNTA + GRAFICO */
        .question-row {
            display: grid;
            grid-template-columns: 1fr 250px; /* Pergunta ocupa mais espaco, grafico fixo */
            gap: 20px;
            align-items: center;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius);
            padding: 15px 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .question-row:hover {
            border-color: var(--accent-blue);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .input-group select {
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-dark);
            background: #f8fafc;
            transition: all 0.3s;
            cursor: pointer;
            appearance: none; /* Remove seta padrao */
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231976d2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 1em;
        }

        .input-group select:focus {
            outline: none;
            border-color: var(--primary-main);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        .chart-wrapper {
            height: 180px;
            width: 100%;
            position: relative;
        }

        /* BOTAO ENVIAR */
        .actions-area {
            margin-top: 30px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px dashed #e2e8f0;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-main) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary-main);
            border: 2px solid var(--primary-main);
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 15px;
        }

        .btn-secondary:hover {
            background: var(--primary-light);
        }

        /* DASHBOARD RESULTADOS */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }

        .stat-card h4 {
            color: var(--primary-dark);
            margin-bottom: 15px;
            font-size: 1rem;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-gray);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-dark);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            transform: translateX(150%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 1000;
            font-weight: 500;
        }

        .toast.show {
            transform: translateX(0);
        }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            .question-row {
                grid-template-columns: 1fr;
            }
            .chart-wrapper {
                height: 200px;
                margin-top: 10px;
            }
            header h1 {
                font-size: 1.8rem;
            }
            .nav-tabs {
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Questionario Socioeconomico</h1>
        <p>Analise detalhada de perfil pessoal, educacional e profissional</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('form')">Formulario</button>
        <button class="tab-btn" onclick="switchTab('results')">Resultados Globais</button>
    </div>

    <!-- SECAO FORMULARIO -->
    <div id="form" class="content-section active">
        <form id="mainForm">
            
            <!-- CATEGORIA 1: PESSOAL -->
            <section class="category-block">
                <div class="category-title">
                    <span class="category-icon">1</span> Dados Pessoais
                </div>
                
                <!-- Geraremos as perguntas via JS para manter o codigo limpo e dinamico -->
                <div id="questions-personal"></div>
            </section>

            <!-- CATEGORIA 2: EDUCACIONAL -->
            <section class="category-block">
                <div class="category-title">
                    <span class="category-icon">2</span> Dados Educacionais
                </div>
                <div id="questions-educational"></div>
            </section>

            <!-- CATEGORIA 3: PROFISSIONAL -->
            <section class="category-block">
                <div class="category-title">
                    <span class="category-icon">3</span> Dados Profissionais
                </div>
                <div id="questions-professional"></div>
            </section>

            <div class="actions-area">
                <button type="submit" class="btn-primary">Salvar Respostas</button>
                <button type="button" class="btn-secondary" onclick="clearData()">Limpar Cache</button>
            </div>
        </form>
    </div>

    <!-- SECAO RESULTADOS GLOBAIS -->
    <div id="results" class="content-section">
        <div class="category-title">
            Estatisticas Agregadas (Base de Dados Local)
        </div>
        <div id="global-stats-container" class="dashboard-grid">
            <div class="empty-state">Carregando dados...</div>
        </div>
    </div>
</div>

<!-- TOAST NOTIFICATION -->
<div id="toast" class="toast">Resposta salva com sucesso!</div>

<script>
    // --- CONFIGURACAO DOS DADOS ---
    
    const config = {
        personal: [
            { id: 'p1', q: 'Qual e a sua faixa etaria?', opts: ['Menos de 18 anos', '18 a 25 anos', '26 a 35 anos', '36 a 50 anos', 'Mais de 50 anos'] },
            { id: 'p2', q: 'Qual e o seu genero?', opts: ['Feminino', 'Masculino', 'Nao-binario', 'Prefiro nao informar'] },
            { id: 'p3', q: 'Qual e o seu estado civil?', opts: ['Solteiro(a)', 'Casado(a)/Uniao estavel', 'Divorciado(a)', 'Viuv(a)'] },
            { id: 'p4', q: 'Quantas pessoas residem em sua casa?', opts: ['1 pessoa', '2 pessoas', '3 a 4 pessoas', '5 ou mais pessoas'] },
            { id: 'p5', q: 'Qual e a sua renda familiar mensal?', opts: ['Ate 1 salario minimo', 'De 1 a 3 salarios minimos', 'De 3 a 5 salarios minimos', 'De 5 a 10 salarios minimos', 'Acima de 10 salarios minimos'] },
            { id: 'p6', q: 'Voce e responsavel financeiro principal?', opts: ['Sim', 'Nao', 'Divido com outra pessoa'] },
            { id: 'p7', q: 'Qual e a sua regiao de moradia?', opts: ['Centro', 'Zona Norte', 'Zona Sul', 'Zona Leste', 'Zona Oeste', 'Periferia'] },
            { id: 'p8', q: 'Voce possui plano de saude?', opts: ['Sim, particular', 'Sim, convenio empresarial', 'Sim, publico (SUS)', 'Nao possuo'] },
            { id: 'p9', q: 'Voce possui acesso a internet em casa?', opts: ['Sim, banda larga fixa', 'Sim, apenas movel', 'Nao possuo'] },
            { id: 'p10', q: 'Classe social auto-declarada?', opts: ['Classe A', 'Classe B', 'Classe C', 'Classe D', 'Classe E'] }
        ],
        educational: [
            { id: 'e1', q: 'Nivel de escolaridade atual?', opts: ['Fundamental Incompl.', 'Fundamental Compl.', 'Medio Incompl.', 'Medio Compl.', 'Superior Incompl.', 'Superior Compl.', 'Pos/Mestrado/Dout.'] },
            { id: 'e2', q: 'Escola publica ou privada?', opts: ['Apenas publica', 'Apenas privada', 'Ambas'] },
            { id: 'e3', q: 'Ultima instituicao frequentada?', opts: ['Escola Municipal/Estadual', 'Escola Particular', 'Universidade Publica', 'Universidade Privada', 'Inst. Federal/Tecnico'] },
            { id: 'e4', q: 'Concluiu ensino superior?', opts: ['Sim', 'Nao, mas cursando', 'Nao, e nao pretendo', 'Nao, mas pretendo'] },
            { id: 'e5', q: 'Curso tecnico/profissionalizante?', opts: ['Sim, concluido', 'Sim, em andamento', 'Nao, mas tenho interesse', 'Nao, e sem interesse'] },
            { id: 'e6', q: 'Idiomas dominados (alem PT)?', opts: ['Nenhum', 'Um', 'Dois', 'Tres ou mais'] },
            { id: 'e7', q: 'Certificacao profissional?', opts: ['Sim, varias', 'Sim, uma/duas', 'Nao, buscando', 'Nao'] },
            { id: 'e8', q: 'Avaliacao da qualidade educacao?', opts: ['Excelente', 'Boa', 'Regular', 'Ruim', 'Pessima'] },
            { id: 'e9', q: 'Pretende continuar estudos?', opts: ['Sim, graduacao', 'Sim, pos-graduacao', 'Sim, cursos livres', 'Nao pretendo'] },
            { id: 'e10', q: 'Principal fator trajetoria educ.? ', opts: ['Apoio familiar', 'Oportunidades financeiras', 'Interesse pessoal', 'Necessidade prof.', 'Dificuldades financeiras'] }
        ],
        professional: [
            { id: 'f1', q: 'Situacao no mercado de trabalho?', opts: ['CLT', 'Sem Carteira', 'Autonomo', 'Empresario', 'Desempregado', 'Aposentado', 'Estudante'] },
            { id: 'f2', q: 'Tempo na ocupacao atual?', opts: ['< 1 ano', '1 a 3 anos', '3 a 5 anos', '> 5 anos', 'Nao trabalha'] },
            { id: 'f3', q: 'Ramo de atuacao?', opts: ['Tecnologia', 'Saude', 'Educacao', 'Comercio', 'Industria', 'Servicos', 'Outro'] },
            { id: 'f4', q: 'Nivel hierarquico?', opts: ['Estagiario/Aprendiz', 'Operacional/Auxiliar', 'Tecnico/Analista', 'Coord./Supervisao', 'Gerencia', 'Diretoria'] },
            { id: 'f5', q: 'Trabalha na area de formacao?', opts: ['Sim, totalmente', 'Parcialmente', 'Nao', 'Nao sou formado'] },
            { id: 'f6', q: 'Faixa salarial mensal?', opts: ['Ate 1 SM', '1 a 3 SM', '3 a 5 SM', '5 a 10 SM', '> 10 SM'] },
            { id: 'f7', q: 'Possui outro emprego/renda?', opts: ['Sim', 'Nao'] },
            { id: 'f8', q: 'Estabilidade do emprego?', opts: ['Muito estavel', 'Estavel', 'Incerto', 'Instavel', 'N/A'] },
            { id: 'f9', q: 'Pretende mudar de emprego?', opts: ['Sim, com certeza', 'Talvez', 'Nao', 'N/A'] },
            { id: 'f10', q: 'Fator de satisfacao profissional?', opts: ['Salario', 'Ambiente', 'Crescimento', 'Reconhecimento', 'Equilibrio Vida/Trab.'] }
        ]
    };

    // Paleta de cores azul gradiente para os graficos
    const chartColors = ['#0d47a1', '#1565c0', '#1976d2', '#1e88e5', '#2196f3', '#42a5f5', '#64b5f6', '#90caf9'];

    let chartsInstances = {}; // Armazena instancias dos graficos individuais
    let globalChartsInstances = {}; // Armazena instancias dos graficos globais

    // --- INICIALIZACAO ---

    document.addEventListener('DOMContentLoaded', () => {
        renderQuestions();
        loadSavedAnswersToForms();
        initGlobalStats();
    });

    function renderQuestions() {
        const sections = ['personal', 'educational', 'professional'];
        
        sections.forEach(cat => {
            const container = document.getElementById(`questions-${cat}`);
            container.innerHTML = ''; // Limpa
            
            config[cat].forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'question-row';
                
                // HTML da Pergunta
                let optionsHtml = '<option value="">Selecione...</option>';
                item.opts.forEach(opt => {
                    optionsHtml += `<option value="${opt}">${opt}</option>`;
                });

                row.innerHTML = `
                    <div class="input-group">
                        <label>${index + 1}. ${item.q}</label>
                        <select name="${item.id}" onchange="handleSelectChange('${item.id}', this.value)">
                            ${optionsHtml}
                        </select>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="chart_${item.id}"></canvas>
                    </div>
                `;
                container.appendChild(row);
            });
        });
    }

    // --- LOGICA DE INTERACAO ---

    function handleSelectChange(questionId, selectedValue) {
        if (!selectedValue) return;

        // Atualiza grafico individual imediatamente
        updateIndividualChart(questionId, selectedValue);

        // Salva temporariamente na memoria/localStorage para persistir entre refresh
        saveAnswerLocal(questionId, selectedValue);
    }

    function updateIndividualChart(qId, newValue) {
        const ctx = document.getElementById(`chart_${qId}`).getContext('2d');
        
        // Busca historico dessa pergunta especifica no localStorage
        const history = getHistoryForQuestion(qId);
        
        // Prepara dados para o grafico de pizza
        const labels = Object.keys(history);
        const dataValues = Object.values(history);
        const total = dataValues.reduce((a, b) => a + b, 0);

        // Destroi grafico anterior se existir para recriar limpo (evita bugs de animacao acumulada)
        if (chartsInstances[qId]) {
            chartsInstances[qId].destroy();
        }

        chartsInstances[qId] = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: labels.map(l => `${l} (${((history[l]/total)*100).toFixed(0)}%)`),
                datasets: [{
                    data: dataValues,
                    backgroundColor: generatePalette(labels.length),
                    borderWidth: 1,
                    borderColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }, // Legenda oculta para economizar espaco no card pequeno
                    tooltip: { enabled: true }
                },
                cutout: '60%' // Transforma em donut chart para visual mais moderno
            }
        });
    }

    function generatePalette(count) {
        const palette = [];
        for(let i=0; i<count; i++) {
            palette.push(chartColors[i % chartColors.length]);
        }
        return palette;
    }

    // --- BANCO DE DADOS LOCAL (SIMULACAO) ---

    function saveAnswerLocal(qId, val) {
        let db = JSON.parse(localStorage.getItem('sq_db') || '{}');
        
        // Estrutura: { "p1": { "Opcao A": 1, "Opcao B": 2 }, ... }
        if (!db[qId]) db[qId] = {};
        
        // Incrementa contador
        db[qId][val] = (db[qId][val] || 0) + 1;
        
        localStorage.setItem('sq_db', JSON.stringify(db));
    }

    function getHistoryForQuestion(qId) {
        const db = JSON.parse(localStorage.getItem('sq_db') || '{}');
        return db[qId] || {};
    }

    function getAllDb() {
        return JSON.parse(localStorage.getItem('sq_db') || '{}');
    }

    function clearData() {
        if(confirm('Tem certeza que deseja apagar TODOS os dados salvos neste navegador?')) {
            localStorage.removeItem('sq_db');
            location.reload();
        }
    }

    function loadSavedAnswersToForms() {
        // Esta funcao serve para preencher os selects caso o usuario recarregue a pagina
        // Mas como queremos simular "novas respostas", deixamos vazio por padrao 
        // a menos que queira ver ultimas respostas. Aqui focamos no acumulo.
    }

    // --- SUBMIT DO FORMULARIO ---

    document.getElementById('mainForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        let count = 0;
        
        for (let pair of formData.entries()) {
            if(pair[1]) {
                // Ja foi salvo no onchange, aqui apenas confirma visibilidade
                count++;
            }
        }

        showToast(`${count} respostas processadas e adicionadas ao banco de dados local.`);
        
        // Recarrega dashboard silenciosamente
        initGlobalStats();
        
        // Reset visual opcional? Não, vamos deixar preenchido para mostrar o fluxo.
        // this.reset(); 
    });

    // --- DASHBOARD GLOBAL ---

    function switchTab(tabName) {
        document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');

        if(tabName === 'results') {
            initGlobalStats();
        }
    }

    function initGlobalStats() {
        const container = document.getElementById('global-stats-container');
        const db = getAllDb();
        container.innerHTML = '';

        const allKeys = Object.keys(config.personal).concat(Object.keys(config.educational)).concat(Object.keys(config.professional));
        // Na verdade, iteramos pelos arrays de configuracao
        
        let hasData = false;

        const categories = [
            { name: 'Dados Pessoais', items: config.personal },
            { name: 'Dados Educacionais', items: config.educational },
            { name: 'Dados Profissionais', items: config.professional }
        ];

        categories.forEach(catGroup => {
            catGroup.items.forEach(item => {
                const stats = db[item.id];
                if(stats && Object.keys(stats).length > 0) {
                    hasData = true;
                    
                    const card = document.createElement('div');
                    card.className = 'stat-card';
                    card.innerHTML = `
                        <h4>${item.q}</h4>
                        <div style="height: 200px;"><canvas id="glob_${item.id}"></canvas></div>
                    `;
                    container.appendChild(card);

                    // Criar grafico global
                    setTimeout(() => {
                        createGlobalChart(item.id, stats);
                    }, 100);
                }
            });
        });

        if(!hasData) {
            container.innerHTML = '<div class="empty-state">Nenhuma resposta registrada ainda. Preencha o formulario.</div>';
        }
    }

    function createGlobalChart(qId, statsObj) {
        const ctx = document.getElementById(`glob_${qId}`).getContext('2d');
        const labels = Object.keys(statsObj);
        const values = Object.values(statsObj);
        const total = values.reduce((a,b)=>a+b,0);

        if(globalChartsInstances[qId]) globalChartsInstances[qId].destroy();

        globalChartsInstances[qId] = new Chart(ctx, {
            type: 'bar', // Grafico de barras para comparar melhor no dashboard geral
            data: {
                labels: labels,
                datasets: [{
                    label: 'Contagem',
                    data: values,
                    backgroundColor: '#1976d2',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } },
                    x: { ticks: { font: { size: 10 } } }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const val = context.raw;
                                const pct = ((val/total)*100).toFixed(1);
                                return `${val} respostas (${pct}%)`;
                            }
                        }
                    }
                }
            }
        });
    }

    // --- UTILITARIOS ---

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

</script>
</body>
